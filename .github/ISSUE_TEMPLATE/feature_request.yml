name: 💡 Feature Request / RFC
description: Suggest an idea, enhancement, or architectural improvement for Reactive Skills
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or architectural suggestion? We welcome proposals that preserve deterministic execution, event sourcing, and state independence.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Core Runtime & FSM Engine"
        - "Guards & Evaluators"
        - "Event Sourcing & SQLite Storage"
        - "Projections & Handlebars Templates"
        - "AXI CLI & TOON Formatting"
        - "MCP Server & Agent Tools"
        - "Developer Experience & Tooling"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or friction point?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Design
      description: Describe the solution you would like to see, including API changes or statechart syntax if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you considered?
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a PR to implement this feature.
