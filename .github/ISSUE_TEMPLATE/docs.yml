name: 📖 Documentation Issue
description: Report missing, incorrect, or unclear documentation or specifications
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Documentation Page or File
      placeholder: "e.g. README.md, AGENTS.md, docs/SPEC.md"
    validations:
      required: true
  - type: textarea
    id: issue_description
    attributes:
      label: What is unclear or incorrect?
      description: Describe the error, omission, or confusing section.
    validations:
      required: true
  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested Improvement
      description: How would you improve this documentation?
